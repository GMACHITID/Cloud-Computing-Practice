<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Homework Submission</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('imgs/89939503_2749424095293305_8900976475763638272_n.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            margin-top: 50px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-size: 2.5em;
        }

        h2 {
            position: absolute;
            font-size: 2em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            animation: rgbBlink 1s infinite;
        }

        @keyframes rgbBlink {
            0% { color: rgb(255, 0, 0); }
            33% { color: rgb(0, 255, 0); }
            66% { color: rgb(0, 0, 255); }
            100% { color: rgb(255, 0, 0); }
        }

        /* Chat Bot Styles */
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            max-height: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }

        .chatbot-container.active {
            display: flex;
        }

        .chatbot-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chatbot-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .chatbot-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chatbot-close:hover {
            opacity: 0.8;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chatbot-input-container {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chatbot-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .chatbot-input:focus {
            border-color: #667eea;
        }

        .chatbot-send {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .chatbot-send:hover {
            background: #5568d3;
        }

        .chatbot-send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .chatbot-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }

        .chatbot-toggle:hover {
            transform: scale(1.1);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* PDF Upload - centered in the middle of the screen */
        .pdf-upload-center {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .pdf-upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .pdf-upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .pdf-upload-btn:active {
            transform: scale(0.98);
        }

        .pdf-file-input {
            display: none;
        }

        .pdf-upload-hint {
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            font-size: 0.85rem;
        }

        /* PDF Viewer overlay */
        .pdf-viewer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pdf-viewer-overlay.active {
            display: flex;
        }

        .pdf-viewer-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .pdf-viewer-header {
            background: #333;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pdf-viewer-header h3 {
            margin: 0;
            font-size: 1rem;
        }

        .pdf-viewer-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
            line-height: 1;
        }

        .pdf-viewer-close:hover {
            opacity: 0.8;
        }

        .pdf-viewer-frame {
            width: 85vw;
            height: 80vh;
            min-height: 400px;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Hey, this is my submission for the week 3 homework</h1>
    <h2 id="jumpingH2">I found this picture in the depths of my folders</h2>

    <!-- PDF Upload - centered in the middle -->
    <div class="pdf-upload-center">
        <input type="file" id="pdfFileInput" class="pdf-file-input" accept="application/pdf" />
        <button type="button" class="pdf-upload-btn" id="pdfUploadBtn">Upload PDF</button>
        <span class="pdf-upload-hint">PDF only</span>
    </div>

    <!-- PDF Viewer overlay -->
    <div class="pdf-viewer-overlay" id="pdfViewerOverlay">
        <div class="pdf-viewer-container">
            <div class="pdf-viewer-header">
                <h3 id="pdfViewerTitle">PDF Document</h3>
                <button type="button" class="pdf-viewer-close" id="pdfViewerClose">×</button>
            </div>
            <iframe id="pdfViewerFrame" class="pdf-viewer-frame" title="PDF viewer"></iframe>
        </div>
    </div>

    <!-- Chat Bot Toggle Button -->
    <button class="chatbot-toggle" id="chatbotToggle" title="Open Chat Bot">
        💬
    </button>

    <!-- Chat Bot Container -->
    <div class="chatbot-container" id="chatbotContainer">
        <div class="chatbot-header">
            <h3>Customer Support Chat</h3>
            <button class="chatbot-close" id="chatbotClose">×</button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="message bot">
                👋 Hello! I'm your AI assistant. How can I help you today?
            </div>
        </div>
        <div class="chatbot-input-container">
            <input 
                type="text" 
                class="chatbot-input" 
                id="chatbotInput" 
                placeholder="Type your message..."
                autocomplete="off"
            >
            <button class="chatbot-send" id="chatbotSend">Send</button>
        </div>
    </div>

    <!-- API Configuration - Using Cloudflare Worker -->
    <script>
        // Use Cloudflare Worker endpoint (no API key needed in client)
        const CHAT_API_URL = '/api/chat';
    </script>
    
    <script>
        const h2 = document.getElementById('jumpingH2');
        
        function jumpAround() {
            const maxX = window.innerWidth - h2.offsetWidth;
            const maxY = window.innerHeight - h2.offsetHeight;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            h2.style.left = randomX + 'px';
            h2.style.top = randomY + 'px';
        }

        // Initial position
        jumpAround();
        
        // Jump every 1 second (1000 milliseconds)
        setInterval(jumpAround, 1000);

        // Chat Bot Functionality
        const chatbotToggle = document.getElementById('chatbotToggle');
        const chatbotContainer = document.getElementById('chatbotContainer');
        const chatbotClose = document.getElementById('chatbotClose');
        const chatbotMessages = document.getElementById('chatbotMessages');
        const chatbotInput = document.getElementById('chatbotInput');
        const chatbotSend = document.getElementById('chatbotSend');

        // Toggle chat bot
        chatbotToggle.addEventListener('click', () => {
            chatbotContainer.classList.add('active');
            chatbotToggle.style.display = 'none';
            chatbotInput.focus();
        });

        chatbotClose.addEventListener('click', () => {
            chatbotContainer.classList.remove('active');
            chatbotToggle.style.display = 'flex';
        });

        // Send message function
        async function sendMessage() {
            const message = chatbotInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage('user', message);
            chatbotInput.value = '';
            chatbotSend.disabled = true;
            chatbotSend.innerHTML = '<div class="loading"></div>';

            try {
                // Call Cloudflare Worker instead of Gemini API directly
                const response = await fetch(CHAT_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    const botResponse = data.candidates[0].content.parts[0].text;
                    addMessage('bot', botResponse);
                } else if (data.error) {
                    throw new Error(data.error);
                } else {
                    throw new Error('Unexpected API response format');
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('bot', 'Sorry, I encountered an error. Please try again.');
            } finally {
                chatbotSend.disabled = false;
                chatbotSend.innerHTML = 'Send';
                chatbotInput.focus();
            }
        }

        // Add message to chat
        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatbotMessages.appendChild(messageDiv);
            chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
        }

        // Send on button click
        chatbotSend.addEventListener('click', sendMessage);

        // Send on Enter key
        chatbotInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // PDF Upload and Read
        const pdfFileInput = document.getElementById('pdfFileInput');
        const pdfUploadBtn = document.getElementById('pdfUploadBtn');
        const pdfViewerOverlay = document.getElementById('pdfViewerOverlay');
        const pdfViewerFrame = document.getElementById('pdfViewerFrame');
        const pdfViewerTitle = document.getElementById('pdfViewerTitle');
        const pdfViewerClose = document.getElementById('pdfViewerClose');

        pdfUploadBtn.addEventListener('click', () => pdfFileInput.click());

        pdfFileInput.addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;

            const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
            if (!isPdf) {
                alert('Please select a PDF file. Only PDF format is allowed.');
                this.value = '';
                return;
            }

            const url = URL.createObjectURL(file);
            pdfViewerTitle.textContent = file.name;
            pdfViewerFrame.src = url;
            pdfViewerOverlay.classList.add('active');
            this.value = '';
        });

        pdfViewerClose.addEventListener('click', () => {
            const src = pdfViewerFrame.src;
            pdfViewerFrame.src = '';
            if (src && src.startsWith('blob:')) URL.revokeObjectURL(src);
            pdfViewerOverlay.classList.remove('active');
        });

        pdfViewerOverlay.addEventListener('click', (e) => {
            if (e.target === pdfViewerOverlay) {
                pdfViewerClose.click();
            }
        });
    </script>
</body>
</html>
